lifecycleViewmodel = "2.11.0"
lifecycleRuntime = "2.11.0"
kotlinxCoroutines = "1.11.0"
exifinterface = "1.4.1"

[libraries]
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
